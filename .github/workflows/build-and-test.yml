name: Build and Test on PR Merge

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mn_playground
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test
        env:
          DATASOURCES_DEFAULT_URL: jdbc:mysql://localhost:3306/mn_playground
          DATASOURCES_DEFAULT_USERNAME: root
          DATASOURCES_DEFAULT_PASSWORD: password

      - name: Build the project
        run: ./gradlew build
        env:
          DATASOURCES_DEFAULT_URL: jdbc:mysql://localhost:3306/mn_playground
          DATASOURCES_DEFAULT_USERNAME: root
          DATASOURCES_DEFAULT_PASSWORD: password

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-and-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/micronaut-crud:latest

      - name: Print image digest
        run: echo "Image digest: ${{ steps.docker_build.outputs.digest }}"